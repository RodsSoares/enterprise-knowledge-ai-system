name: CI - Enterprise Knowledge MVP

on:
  push:
    branches:
      - main
      - claude/lean-mvp-hardening
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    name: Offline tests and corpus checks (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENAI_API_KEY: ""
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run offline unit and integration regression
        run: python -m pytest tests/unit tests/integration -q

      - name: Ensure searchable evidence has no evaluation-harness leakage
        run: python -m app.scripts.audit_corpus_content --snapshot docs/validation/EVIDENCE_UNITS_SNAPSHOT_27DOC.json

      - name: Validate archived RV-045 evaluation coverage (no LLM calls)
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          criteria = yaml.safe_load(Path("data/ground_truth/answer_criteria.yaml").read_text(encoding="utf-8"))
          case_ids = [case["id"] for case in criteria["cases"]]
          report = json.loads(Path("docs/validation/RV045_LEAN_EVALUATION_RESULTS.json").read_text(encoding="utf-8"))
          runs = report["runs"]
          run_ids = [run["case_id"] for run in runs]

          assert len(case_ids) == len(set(case_ids)), "Duplicate criterion IDs"
          assert len(run_ids) == len(set(run_ids)), "Duplicate RV-045 result IDs"
          assert len(run_ids) == 46, f"Expected 46 archived cases, got {len(run_ids)}"
          assert set(run_ids) == set(case_ids), "Archived results do not cover the criteria"
          assert all(type(run.get("passed")) is bool for run in runs), "Missing result scores"
          assert all(run.get("status") for run in runs), "Missing answer outcomes"

          passed = sum(run["passed"] for run in runs)
          print(f"RV-045 archived record: {passed}/{len(runs)} scored as passing")
          print("Record integrity only: this step does NOT regenerate or semantically certify answers.")
          PY
