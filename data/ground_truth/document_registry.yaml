schema_version: "0.1"

artifact:
  name: document_registry
  purpose: >-
    Registry of controlled enterprise documents used by the Enterprise Knowledge
    AI System corpus. It defines document identity, authority, lifecycle,
    relationships, canonical-fact coverage, and expected evaluation role.
  indexed_by_rag: false

registry_rules:
  document_id_format: "DOC-###"
  authority_scale:
    4: corporate_policy
    3: standard
    2: sop_or_governance_record
    1: reference_or_operational_record
  lifecycle_status:
    - active
    - superseded
    - historical
  notes:
    - "Authority level is used together with lifecycle status and effective dates."
    - "A superseded document may remain retrievable for historical questions."
    - "Registry metadata is evaluation/control data and is not itself part of the RAG corpus."
    - "Exact business details not fixed in canonical_facts.yaml must be defined consistently when corpus documents are generated."

