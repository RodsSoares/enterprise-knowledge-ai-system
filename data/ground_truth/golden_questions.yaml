schema_version: "0.1"

artifact:
  name: golden_questions
  purpose: >-
    Controlled evaluation set for retrieval, evidence selection, grounded generation,
    document authority, versioning, conflict resolution, semantic distractors, and abstention.
  indexed_by_rag: false

evaluation_contract:
  primary_set: "Golden Set A — Enterprise Knowledge"
  question_count: 36
  principles:
    - "Expected evidence identifies documents that should support the answer."
    - "Distractors are intentionally plausible but should not replace authoritative evidence."
    - "A correct answer is not sufficient if retrieval relies on the wrong authority or version."
    - "Q29 must abstain because the controlled universe intentionally lacks the requested policy."
    - "Q30 must preserve the human/decision boundary and avoid inventing an authoritative carrier selection."
    - "Q31-Q36 test semantic disambiguation among multiple documents containing AI-related language."

